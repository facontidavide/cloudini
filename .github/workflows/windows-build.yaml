name: Windows Build & Test

on:
  push:
    branches: [ main ]
    paths-ignore: ['**.md', '**.svg', '**.png', 'docs/**', 'LICENSE']
  pull_request:
    branches: [ main ]
    paths-ignore: ['**.md', '**.svg', '**.png', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: ${{ github.workflow }}

      # vcpkg builds GTest from source; its binary cache turns that into a download.
      - uses: actions/cache@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-gtest-${{ runner.os }}-${{ env.ImageVersion }}

      - name: Install GTest
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg install gtest:x64-windows

      # Tools and benchmarks pull extra deps; the library and its tests are what
      # MSVC consumers (Conan, conda win-64) compile.
      - name: Configure
        run: >
          cmake -S cloudini_lib -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DCLOUDINI_BUILD_TOOLS=OFF -DCLOUDINI_BUILD_BENCHMARKS=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_PCL=TRUE
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

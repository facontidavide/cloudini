name: Ubuntu Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: git cmake liblz4-dev libzstd-dev libgtest-dev
          version: 1.0

      - name: Cache CMake files
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cmake
            build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake ../cloudini_lib -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Test embedding as a subproject
        run: |
          cmake -S cloudini_lib/test/subproject -B "$RUNNER_TEMP/subproject"
          cmake --build "$RUNNER_TEMP/subproject" -j$(nproc)
          "$RUNNER_TEMP/subproject/consumer"
          cmake --install "$RUNNER_TEMP/subproject" --prefix "$RUNNER_TEMP/subproject-prefix"
          if find "$RUNNER_TEMP/subproject-prefix" -iname '*cloudini*' | grep -q .; then
            echo "embedded Cloudini added install rules to the parent project"; exit 1
          fi

      - name: Test installed static and shared packages
        shell: bash
        run: |
          for shared in OFF ON; do
            for vendored in OFF ON; do
              build_dir="$RUNNER_TEMP/install-test-$shared-$vendored"
              cmake -S cloudini_lib -B "$build_dir" \
                -DBUILD_SHARED_LIBS="$shared" -DCLOUDINI_FORCE_VENDORED_DEPS="$vendored" \
                -DCLOUDINI_BUILD_TOOLS=OFF -DCLOUDINI_BUILD_BENCHMARKS=OFF \
                -DBUILD_TESTING=OFF -DCMAKE_DISABLE_FIND_PACKAGE_PCL=TRUE \
                -DCMAKE_INSTALL_PREFIX="$build_dir/prefix"
              cmake --build "$build_dir" --parallel 2
              cmake --install "$build_dir"
              mv "$build_dir/prefix" "$build_dir/relocated"
              cmake -S cloudini_lib/test/install -B "$build_dir/consumer" \
                -DCMAKE_PREFIX_PATH="$build_dir/relocated"
              cmake --build "$build_dir/consumer"
              ctest --test-dir "$build_dir/consumer" --output-on-failure
            done
          done

name: ROS2 Humble

on:
  push:
    branches: [ main ]
    paths-ignore: ['**.md', '**.svg', '**.png', 'docs/**', 'LICENSE']
  pull_request:
    branches: [ main ]
    paths-ignore: ['**.md', '**.svg', '**.png', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The setup-ros-docker image is setup-ros pre-applied: no setup-ros step needed.
    container:
      image: rostooling/setup-ros-docker:ubuntu-jammy-ros-humble-ros-base-latest
    steps:
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: |
            cloudini_lib
            cloudini_ros
          target-ros2-distro: humble
          colcon-defaults: |
            {
              "build": {
                "cmake-args": ["-DFETCHCONTENT_FULLY_DISCONNECTED=ON"]
              }
            }
